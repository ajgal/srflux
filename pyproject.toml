[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srflux"
version = "0.1.0"
description = "Surface-renewal sensible heat flux from high-rate scalar series: Van Atta (SR-VA) and Haar wavelet (SR-WL) ramp detectors"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Bambach", email = "nbambach@ucdavis.edu" }]
keywords = ["surface renewal", "eddy covariance", "sensible heat flux",
            "evapotranspiration", "micrometeorology", "van atta", "wavelet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.20", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/nbambach/srflux"
Repository = "https://github.com/nbambach/srflux"
Issues = "https://github.com/nbambach/srflux/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff"]
examples = ["matplotlib>=3.5", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --doctest-glob='*.md'"

[tool.ruff]
line-length = 100
